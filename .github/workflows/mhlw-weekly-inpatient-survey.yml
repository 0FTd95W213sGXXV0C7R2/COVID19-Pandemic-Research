name: Acquire official MHLW weekly inpatient survey Excel files

on:
  push:
    paths:
      - "data/requests/run_mhlw_weekly_inpatient_survey.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhlw-weekly-inpatient-survey
  cancel-in-progress: false

jobs:
  acquire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.3 openpyxl==3.1.5
      - name: Enumerate and download weekly MHLW Excel files
        run: python scripts/acquire_mhlw_weekly_inpatient_survey.py
      - name: Audit weekly workbook schemas, prefecture coverage and missingness
        run: python scripts/audit_mhlw_weekly_inpatient_survey.py
      - name: Commit original files, manifest and audit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/raw/mhlw/weekly_inpatient_survey
          git add data/metadata/mhlw/weekly_inpatient_survey_manifest.json
          git add data/audits/mhlw/weekly_inpatient_survey_audit.json
          if git diff --cached --quiet; then
            echo "No new files to commit."
          else
            git commit -m "Acquire official MHLW weekly inpatient survey Excel files"
            git pull --rebase origin main
            git push
          fi
