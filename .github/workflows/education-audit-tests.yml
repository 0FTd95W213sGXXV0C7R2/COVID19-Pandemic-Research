name: Education audit tests
on:
  push:
    branches: [audit/education-foundation-20261128]
  pull_request:
    branches: [audit/non-covid-access-quality-20261126]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install -r scripts/requirements-education.txt
      - run: PYTHONPATH=scripts python -m unittest discover -s tests -p 'test_education*.py' -v
