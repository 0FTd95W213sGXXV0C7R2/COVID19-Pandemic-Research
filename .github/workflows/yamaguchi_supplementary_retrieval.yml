name: Retrieve Yamaguchi supplementary files from Europe PMC

on:
  push:
    paths:
      - "data/requests/run_yamaguchi_supplementary_retrieval.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yamaguchi-supplementary-retrieval
  cancel-in-progress: false

jobs:
  retrieve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned HTTP dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.3

      - name: Retrieve one article's supplementary archive and calculate hashes
        run: python scripts/retrieve_yamaguchi_supplementary.py

      - name: Commit retrieval result and files if present
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/metadata/non_covid_access/yamaguchi_supplementary_retrieval.json
          git add -f data/raw/non_covid_access/supplementary/yamaguchi_2022
          if git diff --cached --quiet; then
            echo "No retrieval output to commit."
          else
            git commit -m "Record Yamaguchi supplementary retrieval result"
            git push
          fi
