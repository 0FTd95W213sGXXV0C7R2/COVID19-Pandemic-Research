name: Probe official MHLW G-MIS public CSV sources

on:
  push:
    paths:
      - "data/requests/run_mhlw_gmis_publication_probe.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhlw-gmis-publication-probe
  cancel-in-progress: false

jobs:
  acquire-and-inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.3
      - name: Download official MHLW CSV links and inspect headers
        run: python scripts/acquire_mhlw_gmis_publication_probe.py
      - name: Commit probe outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/raw/mhlw/gmis_publication_probe
          git add data/metadata/mhlw/gmis_publication_probe_manifest.json
          if git diff --cached --quiet; then
            echo "No probe outputs to commit."
          else
            git commit -m "Acquire official MHLW G-MIS public CSV probe files"
            git push
          fi
