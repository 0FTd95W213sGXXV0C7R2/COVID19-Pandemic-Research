name: e-Stat COVID infection-classification audit (separate from A3)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire-classification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.5
      - name: Acquire and audit separate infection-classification table
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: python scripts/acquire_estat_infection_classification.py
      - name: Upload raw source and audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: estat-infection-classification-audit-${{ github.run_id }}
          path: artifacts/a3_infection_classification/
          if-no-files-found: warn
          retention-days: 14
