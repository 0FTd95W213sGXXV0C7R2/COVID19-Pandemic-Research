name: Audit footnotes across all MHLW weekly survey workbooks

on:
  push:
    paths:
      - "data/requests/run_mhlw_weekly_all_footnotes.txt"
      - "data/requests/run_mhlw_weekly_dash_cells.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhlw-weekly-all-footnotes
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Extract notes from all 171 workbooks
        run: python scripts/audit_mhlw_weekly_survey_footnotes_all.py
      - name: Extract dash cells with context
        run: python scripts/audit_mhlw_weekly_dash_cells.py
      - name: Commit audit output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/mhlw/weekly_inpatient_survey_footnotes_all.json data/audits/mhlw/weekly_inpatient_survey_dash_cells.json
          if git diff --cached --quiet; then
            echo "No audit output changes."
          else
            git commit -m "Audit footnotes across all MHLW weekly survey workbooks"
            git pull --rebase origin main
            git push
          fi