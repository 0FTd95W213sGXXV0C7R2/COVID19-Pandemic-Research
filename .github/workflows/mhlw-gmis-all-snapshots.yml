name: Acquire all official MHLW G-MIS bed snapshots

on:
  push:
    paths:
      - "data/requests/run_mhlw_gmis_all_snapshots.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhlw-gmis-all-snapshots
  cancel-in-progress: false

jobs:
  acquire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependency
        run: python -m pip install --disable-pip-version-check requests==2.32.3
      - name: Enumerate and acquire all linked MHLW CSV snapshots
        run: python scripts/acquire_mhlw_gmis_all_snapshots.py
      - name: Commit original files and acquisition manifest
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/raw/mhlw/gmis_all_snapshots
          git add data/metadata/mhlw/gmis_all_snapshots_manifest.json
          if git diff --cached --quiet; then
            echo "No new files to commit."
          else
            git commit -m "Acquire all linked official MHLW G-MIS bed snapshots"
            git push
          fi
