name: Build MHLW weekly survey variable crosswalk candidates

on:
  push:
    paths:
      - "data/requests/run_mhlw_weekly_crosswalk.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhlw-weekly-crosswalk
  cancel-in-progress: false

jobs:
  crosswalk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Extract date-specific header paths and variable candidates
        run: python scripts/build_mhlw_weekly_survey_crosswalk.py
      - name: Commit crosswalk output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/mhlw/weekly_inpatient_survey_variable_crosswalk_candidates.json
          if git diff --cached --quiet; then
            echo "No crosswalk output changes."
          else
            git commit -m "Build MHLW weekly survey variable crosswalk candidates"
            git pull --rebase origin main
            git push
          fi
