name: Rebuild FDMA emergency transport source data

on:
  push:
    paths:
      - "data/requests/run_fdma_source_rebuild.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fdma-source-rebuild
  cancel-in-progress: false

jobs:
  acquire-and-inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.3 openpyxl==3.1.5

      - name: Download official FDMA workbook and inventory all sheets
        run: python scripts/rebuild_fdma_source.py

      - name: Audit weekly headers, facility rows, blanks, zeros and subgroup reconciliation
        run: python scripts/audit_fdma_weekly_headers.py

      - name: Build normalized long-format weekly dataset from official workbook
        run: python scripts/build_fdma_weekly_long.py

      - name: Commit original source and structural audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/raw/fdma/emergency_transport/coronavirus_data.xlsx
          git add data/interim/fdma/emergency_transport/sheet_cell_dumps
          git add data/audits/fdma/emergency_transport
          git add -f data/processed/fdma/emergency_transport
          git add data/metadata/fdma/emergency_transport
          git add docs/data_dictionary/FDMA_EMERGENCY_TRANSPORT_WEEKLY.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Acquire and inventory official FDMA source workbook"
            git push
          fi
