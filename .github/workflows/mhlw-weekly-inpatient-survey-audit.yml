name: Audit official MHLW weekly inpatient survey workbooks

on:
  push:
    paths:
      - "data/requests/run_mhlw_weekly_inpatient_survey_audit.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mhlw-weekly-inpatient-survey-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Audit all weekly survey workbooks
        run: python scripts/audit_mhlw_weekly_inpatient_survey.py
      - name: Commit audit output
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audits/mhlw/weekly_inpatient_survey_audit.json
          if git diff --cached --quiet; then
            echo "No audit output changes."
          else
            git commit -m "Audit official MHLW weekly inpatient survey workbooks"
            git pull --rebase origin main
            git push
          fi
